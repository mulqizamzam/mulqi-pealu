name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate plugin
        run: python3 scripts/validate_plugin.py . --json
      - name: Deterministic package and archive validation
        run: |
          python3 scripts/package_plugin.py . --out dist
          python3 scripts/inspect_archive.py dist/mulqi-pealu-0.2.1-rc.2.zip --json
